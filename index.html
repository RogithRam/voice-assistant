<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Mitra – voice assistant prototype</title>
<style>
:root{
  --bg:#030a12; --panel:#0a1826; --panel2:#10283c; --line:#17405a;
  --text:#e8f7ff; --dim:#7fa6bd; --accent:#40dcff; --accent2:#ffb84d; --danger:#ff6b6b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#0a2a40 0%,var(--bg) 60%);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 8px}
h1{font-size:20px;margin:0;letter-spacing:.3px}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--dim)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.icon{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
  color:var(--dim);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#04212b;font-weight:600}
.modes{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:8px}
.modes button{flex:1;padding:8px;border-radius:9px;color:var(--dim);font-size:14px}
.modes button.on{background:var(--panel2);color:var(--text);font-weight:600}
#log{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:8px;min-height:120px}
.msg{max-width:86%;padding:9px 13px;border-radius:16px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--panel2);border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#0d3148;border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--dim);font-size:13px;text-align:center}
.msg.err{color:var(--danger)}
.stage{display:flex;flex-direction:column;align-items:center;padding:10px 0 6px}
#orb{width:230px;height:230px;border-radius:50%;padding:0;display:block;
  filter:drop-shadow(0 0 18px rgba(64,220,255,.35))}
#orb.speaking{filter:drop-shadow(0 0 22px rgba(255,184,77,.45))}
#orb canvas{width:230px;height:230px;display:block}
#orb.connecting{animation:pulse 1s infinite}
.link{color:var(--dim);font-size:12px;text-decoration:underline;margin-top:4px}
@keyframes pulse{50%{transform:scale(.93)}}
#status{margin-top:10px;color:var(--dim);font-size:14px;min-height:20px;text-align:center}
form#typed{display:flex;gap:8px;padding:6px 0 14px}
form#typed input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);font:inherit}
form#typed button{padding:0 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);
  width:min(92vw,460px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{margin:0 0 10px;font-size:18px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px}
dialog input[type=text],dialog input[type=password],dialog select,dialog textarea{width:100%;padding:10px 12px;
  border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
dialog textarea{min-height:64px;resize:vertical}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.hint{font-size:12px;color:var(--dim);margin-top:4px}
.hint a{color:var(--accent2)}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{padding:10px 16px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04212b;font-weight:600}
</style>
</head>
<body>
<header>
  <h1><span id="title">Mitra</span><small>Realtime voice assistant · prototype</small></h1>
  <button class="icon" id="openSettings" aria-label="Settings">⚙</button>
</header>

<div class="chips" id="langs" role="listbox" aria-label="Language"></div>
<div class="modes" id="modes">
  <button data-mode="assistant">Assistant</button>
  <button data-mode="friend">Friend</button>
</div>

<div id="log" aria-live="polite"></div>

<div class="stage">
  <button id="orb" class="idle" aria-label="Start or stop talking"><canvas id="hud"></canvas></button>
  <div id="status">Tap to start talking</div>
  <button class="link" id="demo" type="button">Preview speaking animation</button>
</div>

<form id="typed">
  <input id="text" placeholder="…or type a message" autocomplete="off">
  <button>Send</button>
</form>

<dialog id="settings">
  <h2>Settings</h2>
  <label for="key">Gemini API key</label>
  <input id="key" type="password" placeholder="AIza…" autocomplete="off">
  <div class="hint">Free key from <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Stored only in this browser.</div>
  <label for="aname">Assistant name</label>
  <input id="aname" type="text">
  <label for="uname">Your name (optional)</label>
  <input id="uname" type="text">
  <label for="about">Things it should remember about you (optional)</label>
  <textarea id="about" placeholder="e.g. I live in Chennai, I like cricket and old Ilaiyaraaja songs"></textarea>
  <label for="voice">Voice</label>
  <select id="voice">
    <option value="">Default</option>
    <option>Aoede</option><option>Kore</option><option>Leda</option><option>Zephyr</option>
    <option>Puck</option><option>Charon</option><option>Fenrir</option><option>Orus</option>
  </select>
  <label for="model">Model</label>
  <input id="model" type="text">
  <div class="row"><input id="search" type="checkbox"><label for="search" style="margin:0">Use Google Search for live information</label></div>
  <div class="actions">
    <button class="btn" id="cancel" type="button">Cancel</button>
    <button class="btn primary" id="save" type="button">Save</button>
  </div>
</dialog>

<script>
"use strict";
/* ---------- config ---------- */
const LANGS = [
  ["auto","Auto"],["Hindi","हिन्दी"],["Tamil","தமிழ்"],["Telugu","తెలుగు"],["Kannada","ಕನ್ನಡ"],
  ["Malayalam","മലയാളം"],["Bengali","বাংলা"],["Marathi","मराठी"],["Gujarati","ગુજરાતી"],
  ["Punjabi","ਪੰਜਾਬੀ"],["Urdu","اردو"],["Indian English","English"]
];
const DEFAULTS = {key:"",aname:"Mitra",uname:"",about:"",voice:"",model:"gemini-3.1-flash-live-preview",
  search:true,lang:"auto",mode:"assistant"};
const WS_URL = "wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=";

let cfg = {...DEFAULTS};
try { Object.assign(cfg, JSON.parse(localStorage.getItem("mitra.cfg") || "{}")); } catch(e){}
const saveCfg = () => { try { localStorage.setItem("mitra.cfg", JSON.stringify(cfg)); } catch(e){} };

/* ---------- pure helpers (also unit-tested) ---------- */
function buildPrompt(c){
  const lang = c.lang === "auto"
    ? "Reply in whatever language the user speaks, and switch whenever they switch. If they mix languages (Hinglish, Tanglish and so on), mix the same way."
    : `Speak ${c.lang} by default, in the natural everyday spoken style, not formal textbook language. Mixing in common English words is fine. If the user clearly switches language, follow them.`;
  const role = c.mode === "friend"
    ? `You are ${c.aname}, a warm, funny, caring friend chatting on a voice call. Talk casually, react to what they say, ask about their day, tease gently, and share opinions. Don't sound like customer support.`
    : `You are ${c.aname}, a fast, capable voice assistant in the style of Jarvis: confident, concise, lightly witty. Answer the question first, then add only what is useful.`;
  const who = [c.uname && `The user's name is ${c.uname}.`, c.about && `What you know about them: ${c.about}`].filter(Boolean).join(" ");
  return [role, lang,
    "This is a spoken conversation: keep replies short (one to three sentences unless asked for more), never read out symbols, markdown, or URLs.",
    c.search ? "For news, weather, scores, prices or anything recent, look it up with search before answering, and say so if you are unsure." : "",
    "You are an AI and should say so if asked. The user is in India; use Indian context, units and rupees.",
    who].filter(Boolean).join("\n");
}
function buildSetup(c){
  const gen = {responseModalities:["AUDIO"]};
  if (c.voice) gen.speechConfig = {voiceConfig:{prebuiltVoiceConfig:{voiceName:c.voice}}};
  const setup = {
    model: "models/" + c.model.replace(/^models\//,""),
    generationConfig: gen,
    systemInstruction: {parts:[{text:buildPrompt(c)}]},
    inputAudioTranscription: {}, outputAudioTranscription: {}
  };
  if (c.search) setup.tools = [{googleSearch:{}}];
  return {setup};
}
function bytesToB64(bytes){
  let s = ""; const CH = 0x8000;
  for (let i=0;i<bytes.length;i+=CH) s += String.fromCharCode.apply(null, bytes.subarray(i,i+CH));
  return btoa(s);
}
function b64ToFloat32(b64){
  const bin = atob(b64); const n = bin.length >> 1; const out = new Float32Array(n);
  for (let i=0;i<n;i++){
    let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    out[i] = v / 0x8000;
  }
  return out;
}
function rms16(int16){
  let s = 0; for (let i=0;i<int16.length;i++) s += int16[i]*int16[i];
  return Math.sqrt(s / (int16.length||1)) / 0x8000;
}
if (typeof module !== "undefined") module.exports = {buildPrompt,buildSetup,bytesToB64,b64ToFloat32,rms16,DEFAULTS};

/* ---------- mic capture worklet: resamples to 16 kHz, 16-bit PCM ---------- */
const WORKLET = `
class Cap extends AudioWorkletProcessor{
  constructor(){super();this.ratio=sampleRate/16000;this.pos=0;this.buf=new Int16Array(1600);this.n=0;}
  process(inputs){
    const ch=inputs[0]&&inputs[0][0]; if(!ch) return true;
    while(this.pos<ch.length){
      const i=Math.floor(this.pos), f=this.pos-i, a=ch[i], b=i+1<ch.length?ch[i+1]:a;
      let s=a+(b-a)*f; s=s<-1?-1:s>1?1:s;
      this.buf[this.n++]=s<0?s*0x8000:s*0x7fff;
      if(this.n===this.buf.length){const o=this.buf.slice(0);this.port.postMessage(o.buffer,[o.buffer]);this.n=0;}
      this.pos+=this.ratio;
    }
    this.pos-=ch.length; return true;
  }
}
registerProcessor("cap",Cap);`;

/* ---------- app (browser only) ---------- */
if (typeof document !== "undefined") (function(){
const $ = id => document.getElementById(id);
const log = $("log"), orb = $("orb"), statusEl = $("status");
let ws=null, ctx=null, stream=null, node=null, src=null, live=false, ready=false;
let nextTime=0, playing=new Set(), cur={role:null,el:null}, wake=null;

function setStatus(t, cls){ statusEl.textContent=t; orb.className=cls||""; }
function addMsg(role, text){
  const el=document.createElement("div"); el.className="msg "+role; el.textContent=text;
  log.appendChild(el); log.scrollTop=log.scrollHeight; return el;
}
function stream_(role, text){
  if (!text) return;
  if (cur.role!==role){ cur={role, el:addMsg(role,"")}; }
  cur.el.textContent += text; log.scrollTop=log.scrollHeight;
}
function endBubble(){ cur={role:null,el:null}; }

/* chips + modes */
LANGS.forEach(([v,label])=>{
  const b=document.createElement("button"); b.className="chip"; b.textContent=label; b.dataset.v=v;
  b.onclick=()=>{ cfg.lang=v; saveCfg(); paint(); restartIfLive(); };
  $("langs").appendChild(b);
});
$("modes").querySelectorAll("button").forEach(b=>b.onclick=()=>{ cfg.mode=b.dataset.mode; saveCfg(); paint(); restartIfLive(); });
function paint(){
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.v===cfg.lang));
  $("modes").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.mode===cfg.mode));
  $("title").textContent=cfg.aname||"Mitra";
}
function restartIfLive(){ if(live){ stop(); addMsg("sys","Settings changed – tap to talk again"); } }

/* settings */
const dlg=$("settings");
function openSettings(){
  ["key","aname","uname","about","voice","model"].forEach(k=>$(k).value=cfg[k]||"");
  $("search").checked=!!cfg.search; dlg.showModal();
}
$("openSettings").onclick=openSettings;
$("cancel").onclick=()=>dlg.close();
$("save").onclick=()=>{
  ["key","aname","uname","about","voice","model"].forEach(k=>cfg[k]=$(k).value.trim());
  if(!cfg.model) cfg.model=DEFAULTS.model; if(!cfg.aname) cfg.aname=DEFAULTS.aname;
  cfg.search=$("search").checked; saveCfg(); paint(); dlg.close(); restartIfLive();
};

/* audio out */
function playChunk(b64){
  const f=b64ToFloat32(b64); if(!f.length||!ctx) return;
  const buf=ctx.createBuffer(1,f.length,24000); buf.copyToChannel(f,0);
  const s=ctx.createBufferSource(); s.buffer=buf; s.connect(outAn||ctx.destination);
  const t=Math.max(ctx.currentTime+0.03,nextTime); s.start(t); nextTime=t+buf.duration;
  playing.add(s); orb.className="speaking"; statusEl.textContent="Speaking…";
  s.onended=()=>{ playing.delete(s); if(!playing.size&&live){ setStatus("Listening…",""); } };
}
function flushAudio(){ playing.forEach(s=>{try{s.stop()}catch(e){}}); playing.clear(); nextTime=0; }

/* connection */
function connect(){
  return new Promise((resolve,reject)=>{
    ws=new WebSocket(WS_URL+encodeURIComponent(cfg.key)); ready=false;
    ws.onopen=()=>ws.send(JSON.stringify(buildSetup(cfg)));
    ws.onmessage=async ev=>{
      let txt=ev.data; if(typeof txt!=="string") txt=await (txt.text?txt.text():new Response(txt).text());
      let m; try{ m=JSON.parse(txt); }catch(e){ return; }
      if(m.setupComplete){ ready=true; resolve(); return; }
      const sc=m.serverContent;
      if(sc){
        if(sc.interrupted){ flushAudio(); endBubble(); }
        if(sc.inputTranscription) stream_("user",sc.inputTranscription.text);
        if(sc.outputTranscription) stream_("bot",sc.outputTranscription.text);
        if(sc.modelTurn&&sc.modelTurn.parts) sc.modelTurn.parts.forEach(p=>{ if(p.inlineData&&p.inlineData.data) playChunk(p.inlineData.data); });
        if(sc.turnComplete) endBubble();
      }
      if(m.goAway) addMsg("sys","Session is about to end – tap the mic to start a new one.");
    };
    ws.onerror=()=>{};
    ws.onclose=ev=>{
      const why=ev.reason||("connection closed (code "+ev.code+")");
      if(!ready) reject(new Error(why));
      else if(live){ addMsg("sys err","Disconnected: "+why); stop(); }
    };
  });
}

async function start(){
  if(!cfg.key){ openSettings(); addMsg("sys","Add your Gemini API key to begin."); return; }
  if(!navigator.mediaDevices||!window.isSecureContext){
    addMsg("sys err","The microphone only works on https:// or localhost. Host this file on a secure link and open it there."); return;
  }
  setStatus("Connecting…","connecting");
  try{
    ctx=new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume();
    outAn=ctx.createAnalyser(); outAn.fftSize=256; outAn.smoothingTimeConstant=.75;
    fdata=new Uint8Array(outAn.frequencyBinCount); outAn.connect(ctx.destination);
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
    const url=URL.createObjectURL(new Blob([WORKLET],{type:"application/javascript"}));
    await ctx.audioWorklet.addModule(url); URL.revokeObjectURL(url);
    await connect();
    src=ctx.createMediaStreamSource(stream); node=new AudioWorkletNode(ctx,"cap");
    node.port.onmessage=e=>{
      if(!ws||ws.readyState!==1||!ready) return;
      const pcm=new Int16Array(e.data);
      ws.send(JSON.stringify({realtimeInput:{audio:{data:bytesToB64(new Uint8Array(e.data)),mimeType:"audio/pcm;rate=16000"}}}));
      micLevel=rms16(pcm);
    };
    const mute=ctx.createGain(); mute.gain.value=0; src.connect(node); node.connect(mute); mute.connect(ctx.destination);
    live=true; setStatus("Listening…","");
    try{ wake=await navigator.wakeLock.request("screen"); }catch(e){}
  }catch(err){
    const msg=err&&err.name==="NotAllowedError" ? "Microphone permission was denied."
      : "Couldn't start: "+(err&&err.message||err)+". Check the API key and model name in Settings; if it still fails, turn off Google Search or set Voice to Default.";
    addMsg("sys err",msg); stop();
  }
}
function stop(){
  live=false; ready=false; flushAudio(); endBubble();
  try{ node&&node.disconnect(); src&&src.disconnect(); }catch(e){}
  stream&&stream.getTracks().forEach(t=>t.stop());
  if(ws){ ws.onclose=null; try{ws.close()}catch(e){} }
  ctx&&ctx.close().catch(()=>{});
  wake&&wake.release&&wake.release().catch(()=>{});
  ws=ctx=stream=node=src=wake=outAn=null; micLevel=0;
  setStatus("Tap to start talking","idle");
}
orb.onclick=()=>{ live ? stop() : (orb.classList.contains("connecting") ? null : start()); };

$("typed").onsubmit=async e=>{
  e.preventDefault(); const t=$("text").value.trim(); if(!t) return;
  if(!live){ await start(); if(!live) return; }
  $("text").value=""; endBubble(); addMsg("user",t); flushAudio();
  ws.send(JSON.stringify({realtimeInput:{text:t}}));
};

/* HUD: rotating rings + voice-reactive bars */
const cv=$("hud"), g=cv.getContext("2d"), N=64, still=matchMedia("(prefers-reduced-motion: reduce)").matches;
var micLevel=0, lvl=0, outAn=null, fdata=null, demoUntil=0, rot=0, lastT=0;
(function(){ const d=Math.min(window.devicePixelRatio||1,3); cv.width=cv.height=230*d; g.scale(d,d); })();
function arc(r,a0,a1,w,al,col){ g.beginPath(); g.arc(0,0,r,a0,a1); g.lineWidth=w; g.strokeStyle="rgba("+col+","+al+")"; g.stroke(); }
function draw(t){
  requestAnimationFrame(draw);
  const dt=Math.min(50,t-lastT); lastT=t;
  const demo=t<demoUntil, speaking=demo||orb.className==="speaking", active=speaking||live;
  let target=0;
  if(demo) target=Math.abs(.45+.4*Math.sin(t*.011)*Math.sin(t*.0037));
  else if(speaking&&outAn){ outAn.getByteFrequencyData(fdata); let s=0; for(let i=1;i<30;i++) s+=fdata[i]; target=Math.min(1,s/29/140); }
  else if(live) target=Math.min(1,micLevel*6);
  lvl+=(target-lvl)*.25;
  if(!still) rot+=dt*(.0003+lvl*.0015);
  const col=speaking?"255,184,77":"64,220,255", dim=active?1:.5;
  g.clearRect(0,0,230,230); g.save(); g.translate(115,115);
  g.save(); g.rotate(rot*.5);
  for(let i=0;i<72;i++){ g.rotate(Math.PI/36); g.fillStyle="rgba("+col+","+(i%6?.25:.7)*dim+")"; g.fillRect(106,-.75,i%6?4:8,1.5); }
  g.restore();
  g.save(); g.rotate(rot*2); for(let k=0;k<3;k++) arc(98,k*2.094,k*2.094+1.5,2.5,.8*dim,col); g.restore();
  g.save(); g.rotate(-rot*3); arc(56,0,2.2,3,.7*dim,col); arc(56,3.14,4.6,3,.7*dim,col); arc(48,1,1.9,1.5,.5*dim,col); arc(48,4,5.6,1.5,.5*dim,col); g.restore();
  for(let i=0;i<N;i++){
    const m=Math.abs(i-N/2)/(N/2); let v;
    if(demo) v=Math.abs(lvl*(.55+.45*Math.sin(i*.9+t*.012)*Math.cos(i*.37-t*.007)));
    else if(speaking&&outAn) v=fdata[1+Math.floor(m*28)]/255;
    else if(live) v=lvl*(.5+.5*Math.sin(i*.7+t*.006));
    else v=.06+.04*Math.sin(i*.5+t*.002);
    g.save(); g.rotate(i/N*Math.PI*2-Math.PI/2); g.fillStyle="rgba("+col+","+(.35+.65*v)*dim+")"; g.fillRect(66,-1.2,4+v*26,2.4); g.restore();
  }
  const r=30+lvl*10, gr=g.createRadialGradient(0,0,0,0,0,r);
  gr.addColorStop(0,"rgba("+col+","+(.55+.4*lvl)*dim+")"); gr.addColorStop(1,"rgba("+col+",0)");
  g.fillStyle=gr; g.beginPath(); g.arc(0,0,r,0,7); g.fill();
  arc(36+lvl*4,0,7,1.2,.6*dim,col);
  g.fillStyle="rgba(255,255,255,"+(.9*dim)+")"; g.font="600 11px system-ui,sans-serif"; g.textAlign="center"; g.textBaseline="middle";
  g.fillText((cfg.aname||"Mitra").toUpperCase().slice(0,10),0,0);
  g.restore();
}
requestAnimationFrame(draw);
$("demo").onclick=()=>{ if(live) return; demoUntil=performance.now()+6000; statusEl.textContent="Speaking… (preview)";
  setTimeout(()=>{ if(!live) setStatus("Tap to start talking","idle"); },6000); };

paint();
if(!cfg.key) addMsg("sys","Welcome! Open ⚙ Settings and paste a free Gemini API key, then tap the mic.");
else addMsg("sys","Pick a language, tap the mic, and just talk. You can interrupt any time.");
})();
</script>
</body>
</html>
